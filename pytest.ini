[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Tier 1 Feature Coverage tests
    tier2: Tier 2 Boundary & Corner Cases tests
    tier3: Tier 3 Cross-Feature Interactions tests
    tier4: Tier 4 Real-World Scenarios tests
    m1: Milestone 1 Models & Networking tests
    m2: Milestone 2 AVPlayer Audio Engine tests
    m3: Milestone 3 SwiftUI UI & Project PBX tests
    m4: Milestone 4 Verification tests
